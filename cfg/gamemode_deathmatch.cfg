// =============================================================================
// Deathmatch Configuration
// Game Type: 1, Game Mode: 2
// =============================================================================

exec server.cfg

// Time limit - 5 minutes
mp_timelimit 5
mp_maxrounds 0

// Warmup
mp_warmuptime 10
mp_warmup_pausetimer 0

// Deathmatch specific
mp_respawn_on_death_ct 1
mp_respawn_on_death_t 1
mp_solid_teammates 0
sv_alltalk 1
sv_deadtalk 1

// Free equipment
mp_free_armor 2
mp_weapons_allow_zeus 1
mp_ct_default_secondary "weapon_hkp2000"
mp_t_default_secondary "weapon_glock"

// Fast respawn
mp_respawn_immunitytime 3
mp_dm_bonus_length_max 30
mp_dm_bonus_length_min 10
mp_dm_time_between_bonus_max 40
mp_dm_time_between_bonus_min 20

// No drops
mp_death_drop_gun 0
mp_death_drop_grenade 0

echo "=== Deathmatch Config Loaded (5 min) ==="

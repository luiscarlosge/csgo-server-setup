// =============================================================================
// CS2 Server Configuration - Base
// =============================================================================

hostname "Luis CS2 Server"
sv_cheats 0
sv_lan 0

// Network settings
sv_maxrate 0
sv_minrate 128000

// Team settings
mp_autoteambalance 1
mp_limitteams 2
mp_friendlyfire 0

// Bot settings (disabled by default - use bots.sh to add)
bot_quota 0
bot_quota_mode fill

// =============================================================================
// Map Voting - Enabled for all modes
// =============================================================================
mp_endmatch_votenextmap 1
mp_endmatch_votenextleveltime 20
mp_endmatch_votenextmap_keepcurrent 1
mp_match_end_changelevel 1

// Logging
log on
sv_logbans 1
sv_logecho 1
sv_logfile 1

// RCON (change this password!)
rcon_password "changeme123"
